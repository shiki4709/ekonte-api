name: Bug report
description: Report a reproducible problem with analysis, generation, or the API.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic or permissioned examples. Never attach API keys or private video. For security issues, use the private reporting link in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: "v0.1.0, Python 3.12, Ubuntu 24.04, FFmpeg 6.x"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "Include the command or request, with credentials and private data removed."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "Include relevant status codes, warnings, or a minimal output excerpt."
    validations:
      required: true
