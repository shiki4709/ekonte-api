name: Documentation
on:
  push:
    paths: ['**.md', 'docs/**', 'scripts/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**.md', 'docs/**', 'scripts/**', '.github/workflows/docs.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]' pillow
      - run: ruff check scripts
      - run: python scripts/check_docs.py
